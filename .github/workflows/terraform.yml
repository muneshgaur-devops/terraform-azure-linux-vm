name: Terraform Azure Linux VM CI/CD

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (dev, prod, all)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
          - all

      action:
        description: 'Terraform Action (plan, apply, destroy)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy


# Required for GitHub OIDC authentication with Azure
permissions:
  id-token: write
  contents: read


jobs:

  # ============================================================
  # TERRAFORM FORMAT & LINT
  # ============================================================
  terraform-fmt:
    name: 'Terraform Format & Lint'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive


  # ============================================================
  # TERRAFORM DEV ENVIRONMENT
  # ============================================================
  terraform-dev:
    name: 'Terraform Dev Environment'
    runs-on: ubuntu-latest
    needs: terraform-fmt

    if: "${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'dev' || inputs.environment == 'all' }}"

    defaults:
      run:
        working-directory: ./environment/dev

    # Azure OIDC credentials for Terraform
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0


      # ========================================================
      # AZURE LOGIN USING APP REGISTRATION + FEDERATED IDENTITY
      # ========================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Verify Azure Login
        run: az account show


      - name: Terraform Init
        run: terraform init


      - name: Terraform Validate
        run: terraform validate


      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars"


      - name: Terraform Apply
        if: "${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') }}"
        run: terraform apply -auto-approve -var-file="terraform.tfvars"


      - name: Terraform Destroy
        if: "${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' }}"
        run: terraform destroy -auto-approve -var-file="terraform.tfvars"


  # ============================================================
  # TERRAFORM PROD ENVIRONMENT
  # ============================================================
  terraform-prod:
    name: 'Terraform Prod Environment'
    runs-on: ubuntu-latest
    needs: terraform-fmt

    if: "${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'prod' || inputs.environment == 'all' }}"

    defaults:
      run:
        working-directory: ./environment/prod

    # Azure OIDC credentials for Terraform
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0


      # ========================================================
      # AZURE LOGIN USING APP REGISTRATION + FEDERATED IDENTITY
      # ========================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Verify Azure Login
        run: az account show


      - name: Terraform Init
        run: terraform init


      - name: Terraform Validate
        run: terraform validate


      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars"


      - name: Terraform Apply
        if: "${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') }}"
        run: terraform apply -auto-approve -var-file="terraform.tfvars"


      - name: Terraform Destroy
        if: "${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' }}"
        run: terraform destroy -auto-approve -var-file="terraform.tfvars"
