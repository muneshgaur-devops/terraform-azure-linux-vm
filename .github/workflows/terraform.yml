name: Terraform Azure Linux VM CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (dev, prod, all)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
          - all
      action:
        description: 'Terraform Action (plan, apply, destroy)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform-fmt:
    name: 'Terraform Format & Lint'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  terraform-dev:
    name: 'Terraform Dev Environment'
    runs-on: ubuntu-latest
    needs: terraform-fmt
    if: "${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'dev' || inputs.environment == 'all' }}"
    defaults:
      run:
        working-directory: ./environment/dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Azure Login
        if: "${{ secrets.AZURE_CREDENTIALS != '' }}"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars"

      - name: Terraform Apply
        if: "${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') }}"
        run: terraform apply -auto-approve -var-file="terraform.tfvars"

      - name: Terraform Destroy
        if: "${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' }}"
        run: terraform destroy -auto-approve -var-file="terraform.tfvars"

  terraform-prod:
    name: 'Terraform Prod Environment'
    runs-on: ubuntu-latest
    needs: terraform-fmt
    if: "${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'prod' || inputs.environment == 'all' }}"
    defaults:
      run:
        working-directory: ./environment/prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Azure Login
        if: "${{ secrets.AZURE_CREDENTIALS != '' }}"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars"

      - name: Terraform Apply
        if: "${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') }}"
        run: terraform apply -auto-approve -var-file="terraform.tfvars"

      - name: Terraform Destroy
        if: "${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' }}"
        run: terraform destroy -auto-approve -var-file="terraform.tfvars"
